name: CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  EXPO_PUBLIC_ENV: production
  EXPO_PUBLIC_SUPABASE_URL: https://gvlnnjcdqpxqyouwypyq.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_IDL4VIURGr0sOZwpHXVZJw_WeI6xm0N

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      # ── Debug APK (push to main, no signing needed) ──────────────────────
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Release AAB (v* tags, needs keystore secrets) ────────────────────
      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > apps/mobile/android/app/release.keystore

      - name: Build release AAB
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_FILE: release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password=$ANDROID_STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD

      - name: Upload release AAB
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.ref_name }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
