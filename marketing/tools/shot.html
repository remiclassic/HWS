<!doctype html>
<meta charset="utf-8">
<style>
  :root { --red:#E8222C; --blue:#3B9BFF; --orange:#FF7A1A; --yellow:#FFD400; --bg:#050D1A; --panel:#0C2038; --text:#F5F8FC; --sub:#A9C3E6; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1290px; height: 2796px; overflow: hidden; background: var(--bg); font-family: "Segoe UI", system-ui, sans-serif; }
  .bg { position: absolute; inset: 0; background:
      radial-gradient(1100px 900px at 50% 38%, rgba(59,155,255,.30), transparent 70%),
      linear-gradient(180deg, #0E2A4E 0%, #081A30 45%, #050D1A 100%); }
  .track { position: absolute; left: -200px; right: -200px; top: 1180px; height: 300px; transform: rotate(-9deg);
      background: linear-gradient(135deg, #FF8F3A 0%, #E85A00 100%); box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  .track::before, .track::after { content: ""; position: absolute; left: 0; right: 0; height: 14px; background: rgba(0,0,0,.22); }
  .track::before { top: 26px; } .track::after { bottom: 26px; }
  .copy { position: absolute; left: 90px; right: 90px; top: 150px; text-align: center; }
  .kicker { color: var(--accent, var(--orange)); font-weight: 900; font-size: 44px; letter-spacing: 7px; text-transform: uppercase; }
  h1 { color: var(--text); font-weight: 900; font-size: 128px; line-height: 1.04; letter-spacing: -3px; margin-top: 26px; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--yellow); }
  .phone { position: absolute; left: 50%; top: 660px; width: 1040px; transform: translateX(-50%);
      border-radius: 110px; padding: 20px; background: linear-gradient(160deg, #2B3A52, #0A1220 40%, #1B2740);
      box-shadow: 0 0 0 3px #3A4C6B, 0 60px 140px rgba(0,0,0,.65), 0 0 120px rgba(59,155,255,.25); }
  .screen { border-radius: 92px; overflow: hidden; background: #0C2038; }
  .status { height: 118px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 78px 18px; color: #F5F8FC; font-weight: 700; font-size: 38px; }
  .status .r { display: flex; gap: 14px; align-items: center; }
  .status .bars { display: flex; gap: 5px; align-items: flex-end; } .status .bars i { width: 8px; background: #F5F8FC; border-radius: 2px; }
  .status .batt { width: 58px; height: 28px; border-radius: 8px; border: 3px solid rgba(245,248,252,.6); padding: 3px; } .status .batt i { display: block; width: 80%; height: 100%; background: #F5F8FC; border-radius: 3px; }
  .phone img { display: block; width: 100%; aspect-ratio: 430 / 932; object-fit: cover; object-position: top; }
  .island { position: absolute; top: 44px; left: 50%; width: 280px; height: 74px; margin-left: -140px; border-radius: 40px; background: #000; }
</style>
<div class="bg"></div><div class="track"></div>
<div class="copy"><div class="kicker" id="k"></div><h1 id="t"></h1></div>
<div class="phone"><div class="screen"><div class="status"><span>9:41</span><span class="r"><span class="bars"><i style="height:12px"></i><i style="height:18px"></i><i style="height:24px"></i><i style="height:30px"></i></span><span class="batt"><i></i></span></span></div><img id="i"></div><div class="island"></div></div>
<script>
  const q = new URLSearchParams(location.search);
  k.textContent = q.get("k"); t.innerHTML = q.get("t"); i.src = q.get("img");
  if (q.get("accent")) document.documentElement.style.setProperty("--accent", q.get("accent"));
</script>
