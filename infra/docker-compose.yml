services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spotter
      POSTGRES_PASSWORD: spotter_dev
      POSTGRES_DB: hotwheels_spotter
    ports:
      - "5433:5432"
    volumes:
      - spotter_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotter -d hotwheels_spotter"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  spotter_pg:
